name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Allow camera (for QR scanning)
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA\|camera" android/app/src/main/AndroidManifest.xml

      - name: Apply StudyTube app icon
        run: |
          RES=android/app/src/main/res
          rm -f $RES/mipmap-*/ic_launcher*.png $RES/mipmap-*/ic_launcher*.webp $RES/mipmap-*/ic_launcher*.xml
          cp -r android-icons/res/* $RES/
          ls $RES/mipmap-xxxhdpi $RES/mipmap-anydpi-v26

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StudyTube-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
